{% extends 'layouts/auth-layout.html' %} {% block content %}
	<h1 class="text-slate-900 text-center text-3xl font-semibold">Iniciar sesión</h1>
	<form class="mt-6 space-y-6" method="POST" action="/auth/login">
		{% with messages = get_flashed_messages(with_categories=true) %}
			{% if messages %}
			<div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative" role="alert">
				<ul>
					{% for category, message in messages %}
						<li>{{ message }}</li>
					{% endfor %}
				</ul>
			</div>
			{% endif %}
		{% endwith %}
		<div class="form-group">
			<label class="form-label">Usuario</label>
			<div class="input-group">
				<input type="email" class="form-control" name="email" placeholder="Correo electrónico" required />
				<div class="input-group-addon">
					<svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-4 h-4 absolute right-4" viewBox="0 0 24 24">
						<circle cx="10" cy="7" r="6" data-original="#000000"></circle>
						<path d="M14 15H6a5 5 0 0 0-5 5 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 5 5 0 0 0-5-5zm8-4h-2.59l.3-.29a1 1 0 0 0-1.42-1.42l-2 2a1 1 0 0 0 0 1.42l2 2a1 1 0 0 0 1.42 0 1 1 0 0 0 0-1.42l-.3-.29H22a1 1 0 0 0 0-2z" data-original="#000000"></path>
					</svg>
				</div>
			</div>
		</div>
		<div class="form-group">
			<label class="form-label">Contraseña</label>
			<div class="input-group">
				<input type="password" class="form-control" name="password" placeholder="Contraseña" required />
				<div class="input-group-addon">
					<svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-4 h-4 absolute right-4 cursor-pointer" viewBox="0 0 128 128">
						<path d="M64 104C22.127 104 1.367 67.496.504 65.943a4 4 0 0 1 0-3.887C1.367 60.504 22.127 24 64 24s62.633 36.504 63.496 38.057a4 4 0 0 1 0 3.887C126.633 67.496 105.873 104 64 104zM8.707 63.994C13.465 71.205 32.146 96 64 96c31.955 0 50.553-24.775 55.293-31.994C114.535 56.795 95.854 32 64 32 32.045 32 13.447 56.775 8.707 63.994zM64 88c-13.234 0-24-10.766-24-24s10.766-24 24-24 24 10.766 24 24-10.766 24-24 24zm0-40c-8.822 0-16 7.178-16 16s7.178 16 16 16 16-7.178 16-16-7.178-16-16-16z" data-original="#000000"></path>
					</svg>
				</div>
			</div>
		</div>

		<div class="flex items-center">
			<input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 shrink-0 text-blue-600 focus:ring-blue-500 border-slate-300 rounded" />
			<label for="remember-me" class="ml-3 block text-sm text-slate-900">
				Mantener sesión iniciada
			</label>
		</div>
		<div class="mt-6">
			<button type="submit" class="btn btn-primary w-full">
				Iniciar sesión
			</button>
		</div>
	</form>
{% endblock %}
