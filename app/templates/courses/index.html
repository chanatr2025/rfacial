{% extends 'layouts/admin-layout.html' %} {% block content %}
<div class="flex flex-col gap-4" x-data="modalTrigger">
	<form class="flex gap-4">
		<input type="search" class="form-control flex-1" placeholder="Buscar por Nombre" name="search" value="{{search}}" />
		<button type="submit" class="btn btn-info">Buscar</button>
		<button type="button" class="btn btn-primary" @click="show()">Agregar nuevo</button>
	</form>
	<div class="bg-white rounded overflow-hidden p-1">
		<table class="table">
			<thead>
				<tr>
					<th>Nombre</th>
					<th>Docente</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				{% for item in courses %}
					<tr>
						<td>{{ item.name }}</td>
						<td>{{ item.teacher.name if item.teacher else 'No asignado' }}</td>
						<td class="text-end">
							<div class="flex justify-end gap-2">
								<button type="button" class="action-btn" @click="loadData('{{ item.id }}')">
									<i class="fa-solid fa-pencil"></i>
								</button>
								<form action="/courses/delete/{{ item.id }}" method="POST" class="inline-block">
									<button type="submit" class="action-btn">
										<i class="fa-solid fa-trash"></i>
									</button>
								</form>
							</div>
						</td>
					</tr>
				{% endfor %}
			</tbody>
		</table>
	</div>
	<div
		class="fixed inset-0 bg-black bg-opacity-50 flex flex-col z-[99] px-1 sm:px-8 py-1 sm:py-8 overflow-y-auto"
		x-show="open"
		x-transition:enter="transition ease-out duration-300"
		x-transition:enter-start="opacity-0"
		x-transition:enter-end="opacity-100"
		x-transition:leave="transition ease-in duration-200"
		x-transition:leave-start="opacity-100"
		x-transition:leave-end="opacity-0"
		x-cloak
	>
    <div class="bg-white w-full rounded-md shadow-lg mx-auto my-auto max-w-4xl py-2 px-4">
			<div class="flex items-center justify-between pb-2">
				<h2 class="text-base font-semibold" x-text="data ? 'Editar curso' : 'Agregar curso'"></h2>
				<button type="button" class="cursor-pointer focus:outline-none" @click="close()">
					<i class="fa-solid fa-xmark text-lg"></i>
				</button>
			</div>
			<form method="POST" x-bind:action="actionUrl()">
				<div class="form-group">
					<label for="name" class="form-label">Nombre</label>
					<input type="text" id="name" name="name" class="form-control w-full" x-bind:value="data ? data.name : ''" required />
				</div>
				<div class="form-group">
					<label for="teacher_id" class="form-label">Docente</label>
					<select id="teacher_id" name="teacher_id" class="form-control w-full" required>
						<option value="" disabled selected>Seleccione</option>
						{% for teacher in teachers %}
							<option value="{{ teacher.id }}" x-bind:selected="data && data.teacher_id === '{{ teacher.id }}'">{{ teacher.name }}</option>
						{% endfor %}
					</select>
				</div>
				<input type="hidden" name="schedules" x-bind:value="JSON.stringify(schedules)" />
				<div class="mb-4">
					<h3 class="text-lg font-semibold my-2 text-violet-600">Horarios</h3>
					<div class="form-group grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
						<div class="">
							<label for="day_of_week" class="form-label">Día de la Semana</label>
							<select class="form-control" id="day_of_week" name="day_of_week" x-model="scheduleData.day_of_week">
								<option value="Monday" x-bind:selected="scheduleData.day_of_week === 'Monday'">Lunes</option>
								<option value="Tuesday" x-bind:selected="scheduleData.day_of_week === 'Tuesday'">Martes</option>
								<option value="Wednesday" x-bind:selected="scheduleData.day_of_week === 'Wednesday'">Miércoles</option>
								<option value="Thursday" x-bind:selected="scheduleData.day_of_week === 'Thursday'">Jueves</option>
								<option value="Friday" x-bind:selected="scheduleData.day_of_week === 'Friday'">Viernes</option>
								<option value="Saturday" x-bind:selected="scheduleData.day_of_week === 'Saturday'">Sábado</option>
								<option value="Sunday" x-bind:selected="scheduleData.day_of_week === 'Sunday'">Domingo</option>
							</select>
						</div>
						<div class="">
							<label for="start_time" class="form-label">Hora de Inicio</label>
							<input
								type="time"
								class="form-control"
								id="start_time"
								name="start_time"
								x-model="scheduleData.start_time"
							/>
						</div>
						<div class="">
							<label for="end_time" class="form-label">Hora de Fin</label>
							<input
								type="time"
								class="form-control"
								id="end_time"
								name="end_time"
								x-model="scheduleData.end_time"
							/>
						</div>
						<div class="flex justify-end items-end">
							<button type="button" class="btn btn-info" @click="addSchedule()">
								<i class="fa-solid fa-plus"></i> Agregar Horario
							</button>
						</div>
					</div>
					<table class="table">
						<thead>
							<tr>
								<th>Día</th>
								<th>Inicio</th>
								<th>Fin</th>
								<th width="10%"></th>
							</tr>
						</thead>
						<tbody>
							<template x-for="(schedule, index) in schedules" :key="index">
								<tr>
									<td x-text="getDayName(schedule.day_of_week)"></td>
									<td x-text="schedule.start_time"></td>
									<td x-text="schedule.end_time"></td>
									<td class="text-end">
										<button type="button" class="action-btn" @click="removeSchedule(schedule.id)">
											<i class="fa-solid fa-trash"></i>
										</button>
									</td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
				<div class="flex justify-end">
					<button type="button" class="btn btn-secondary mr-2" @click="close()">Cancelar</button>
					<button type="submit" class="btn btn-primary">
						<i class="fa-solid fa-check"></i> Guardar
					</button>
				</div>
			</form>
		</div>
  </div>
</div>
<script>
	document.addEventListener('alpine:init', () => {
    Alpine.data('modalTrigger', () => ({
			open: false,
			data: null,
			schedules: [],
			scheduleData: {
				day_of_week: 'Monday',
				start_time: '',
				end_time: ''
			},
			loadData(id) {
				fetch(`/courses/${id}`)
					.then(response => response.json())
					.then(data => {
						this.data = data;
						this.schedules = data.schedules || [];
						this.open = true;
					})
					.catch(error => {
						console.error('Error fetching data:', error);
						toastr.error('Error al cargar los datos del curso.');
					});
			},
			show() {
				this.open = true;
				this.data = null;
				this.schedules = [];
			},
			close() {
				this.open = false;
				this.data = null;
				this.schedules = [];
				this.scheduleData = { day_of_week: '', start_time: '', end_time: '' }
			},
			actionUrl() {
				return this.data ? `/courses/update/${this.data.id}` : '/courses';
			},
			addSchedule() {
				if (this.scheduleData.day_of_week && this.scheduleData.start_time && this.scheduleData.end_time) {
					this.schedules.push({
						id: Date.now(), // Temporary ID for the schedule
						day_of_week: this.scheduleData.day_of_week,
						start_time: this.scheduleData.start_time,
						end_time: this.scheduleData.end_time
					});
					this.scheduleData = { day_of_week: '', start_time: '', end_time: '' }; // Reset schedule data
				} else {
					toastr.error('Por favor, complete todos los campos del horario.');
				}
			},
			removeSchedule(scheduleId) {
				this.schedules = this.schedules.filter(s => s.id !== scheduleId);
			},
			getDayName(day) {
				const days = {
					Monday: 'Lunes',
					Tuesday: 'Martes',
					Wednesday: 'Miércoles',
					Thursday: 'Jueves',
					Friday: 'Viernes',
					Saturday: 'Sábado',
					Sunday: 'Domingo'
				};
				return days[day] || day;
			}
		}))
	})
</script>
{% endblock %}
